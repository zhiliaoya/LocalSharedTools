<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>知了涯-LocalShT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --wx-green: #07c160;
    --wx-green-dark: #06ad56;
    --wx-bg: #ededed;
    --wx-white: #ffffff;
    --wx-text: #191919;
    --wx-text-secondary: #888888;
    --wx-text-muted: #b2b2b2;
    --wx-border: #e5e5e5;
    --wx-bubble-other: #ffffff;
    --wx-bubble-self: #95ec69;
    --wx-bubble-self-text: #191919;
    --wx-topbar: #ededed;
    --wx-input-bg: #f7f7f7;
    --wx-danger: #fa5151;
    --radius-bubble: 8px;
    --content-max: 820px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--wx-bg);
    color: var(--wx-text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100%;
    background: var(--wx-bg);
    position: relative;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    flex: 0 0 auto;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--wx-topbar);
    border-bottom: 1px solid var(--wx-border);
    padding: 0 12px;
    z-index: 20;
    position: relative;
  }
  .topbar-title { font-size: 17px; font-weight: 600; color: var(--wx-text); }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .topbar-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--wx-text-muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--wx-text-muted); transition: background .2s; }
  .dot.on { background: var(--wx-green); }
  .dot.off { background: #fa5151; }

  .icon-btn {
    height: 30px;
    min-width: 30px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--wx-text-secondary);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s;
  }
  .icon-btn:hover { background: rgba(0,0,0,.06); }
  .icon-btn:active { transform: scale(.97); }

  /* ---------- 消息区 ---------- */
  .messages {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  .messages-inner {
    width: 100%;
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 16px 12px 8px;
  }

  .empty-tip { text-align: center; color: var(--wx-text-muted); font-size: 13px; padding: 40px 0; user-select: none; }

  /* ============================================================
     头像左右渲染逻辑（显式 DOM 顺序，不用 row-reverse）
     - other：从左往右 → [头像] → [气泡(名称在上方靠左)]
     - self ：从右往左 → [头像] ← [气泡(名称在上方靠右)]
     DOM 顺序：other=[头像, 气泡]，self=[气泡, 头像]；整行用 justify-content 贴边
     ============================================================ */
  .msg-row {
    display: flex;
    flex-direction: row;
    margin-bottom: 16px;
    align-items: flex-start;
    gap: 8px;
    animation: fadeIn .25s ease;
  }
  .msg-row.other { justify-content: flex-start; }
  .msg-row.self  { justify-content: flex-end; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    flex: 0 0 36px;
    width: 36px; height: 36px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    user-select: none;
    overflow: hidden;
  }
  .msg-row.self .avatar { background: var(--wx-green); }
  .msg-row.other .avatar { background: #7a8fa6; }

  .bubble-wrap { max-width: 72%; display: flex; flex-direction: column; min-width: 0; }
  /* 名称（meta）始终在气泡上方：other 靠左，self 靠右 */
  .msg-row.other .bubble-wrap { align-items: flex-start; }
  .msg-row.self .bubble-wrap { align-items: flex-end; }

  .meta {
    font-size: 11px;
    color: var(--wx-text-muted);
    margin-bottom: 4px;
    padding: 0 4px;
    display: flex;
    gap: 6px;
    align-items: baseline;
    flex-wrap: wrap;
    white-space: nowrap;
  }
  .meta .name {
    color: var(--wx-text-secondary);
    font-weight: 500;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bubble {
    position: relative;
    padding: 9px 12px;
    border-radius: var(--radius-bubble);
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
    text-align: left;
    box-shadow: 0 0.5px 1px rgba(0,0,0,.05);
  }
  .msg-row.other .bubble { background: var(--wx-bubble-other); color: var(--wx-text); border-top-left-radius: 2px; }
  .msg-row.other .bubble::before {
    content: ''; position: absolute; left: -6px; top: 10px;
    border: 5px solid transparent; border-right-color: var(--wx-bubble-other);
  }
  .msg-row.self .bubble { background: var(--wx-bubble-self); color: var(--wx-bubble-self-text); border-top-right-radius: 2px; }
  .msg-row.self .bubble::before {
    content: ''; position: absolute; right: -6px; top: 10px;
    border: 5px solid transparent; border-left-color: var(--wx-bubble-self);
  }

  /* ---------- 文件卡片 ---------- */
  .file-row {
    display: flex;
    align-items: flex-start;
    max-width: 100%;
    min-width: 0;
    flex-direction: column;
  }

  .file-check {
    flex: 0 0 auto;
    width: 18px; height: 18px;
    margin-top: 9px;
    accent-color: var(--wx-green);
    cursor: pointer;
    display: none;
  }
  body.show-file-check .file-check { display: inline-block; }

  .file-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--wx-bubble-other);
    border-radius: var(--radius-bubble);
    padding: 10px 14px;
    min-width: 0;
    max-width: 100%;
    box-shadow: 0 0.5px 1px rgba(0,0,0,.05);
    position: relative;
  }
  .msg-row.self .file-card { background: var(--wx-bubble-self); }
  .msg-row.other .file-card::before {
    content: ''; position: absolute; left: -6px; top: 14px;
    border: 5px solid transparent; border-right-color: var(--wx-bubble-other);
  }
  .msg-row.self .file-card::before {
    content: ''; position: absolute; right: -6px; top: 14px;
    border: 5px solid transparent; border-left-color: var(--wx-bubble-self);
  }

  .file-card.previewable,
  .file-card.grouped { cursor: pointer; }
  .file-card.previewable:hover,
  .file-card.grouped:hover { filter: brightness(0.97); }

  .file-card.grouped .file-icon { font-size: 24px; }

  .file-icon {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 8px;
    background: rgba(255,255,255,.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .msg-row.self .file-icon { background: rgba(255,255,255,.6); }

  .file-icon.has-thumb {
    padding: 0;
    overflow: hidden;
    background: #f2f2f2;
  }
  .file-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .msg-row.self .file-icon.has-thumb { background: rgba(255,255,255,.35); }

  .file-info { min-width: 0; flex: 1 1 auto; }
  .file-name {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }
  .file-size { font-size: 12px; color: var(--wx-text-muted); margin-top: 2px; }

  .file-dl {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--wx-text-secondary);
    text-decoration: none;
    font-size: 16px;
    transition: background .15s;
  }
  .file-dl:hover { background: rgba(0,0,0,.08); }

  /* 文件组展开区 */
  .file-expand {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 100%;
    align-self: stretch;
    min-width: 0;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    background: rgba(0,0,0,.03);
    border-radius: 6px;
    cursor: default;
    min-width: 0;
  }
  .msg-row.self .file-item { background: rgba(255,255,255,.35); }
  .file-item.previewable { cursor: pointer; }
  .file-item:hover { background: rgba(0,0,0,.06); }
  .msg-row.self .file-item:hover { background: rgba(255,255,255,.55); }

  .file-icon-sm {
    flex: 0 0 28px;
    width: 28px; height: 28px;
    border-radius: 6px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    overflow: hidden;
  }
  .file-icon-sm.has-thumb { padding: 0; background: #f2f2f2; }
  .file-icon-sm.has-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }

  .file-item .file-info { min-width: 0; flex: 1 1 auto; }
  .file-item .file-name {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item .file-size { font-size: 11px; color: var(--wx-text-muted); }
  .file-item .file-dl {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--wx-text-secondary);
    text-decoration: none;
    font-size: 14px;
  }
  .file-item .file-dl:hover { background: rgba(0,0,0,.08); }

  .file-collapse-btn {
    margin-top: 2px;
    align-self: center;
    padding: 4px 14px;
    border: 1px solid var(--wx-border);
    border-radius: 14px;
    background: #fff;
    color: var(--wx-text-secondary);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .file-collapse-btn:hover { background: #f0f0f0; }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    flex: 0 0 auto;
    background: var(--wx-white);
    border-top: 1px solid var(--wx-border);
    display: flex;
    justify-content: center;
  }
  .toolbar-inner {
    width: 100%;
    max-width: var(--content-max);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--wx-text-secondary);
  }
  .toolbar-inner.hidden { display: none; }
  .toolbar button {
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--wx-border);
    border-radius: 6px;
    background: #fafafa;
    font-family: inherit;
    font-size: 13px;
    color: var(--wx-text-secondary);
    cursor: pointer;
  }
  .toolbar button:hover { background: #f0f0f0; }
  .toolbar button.primary {
    background: var(--wx-green);
    border-color: var(--wx-green);
    color: #fff;
  }
  .toolbar button.primary:hover { background: var(--wx-green-dark); }
  .toolbar .sel-count { margin-left: auto; }

  /* ---------- 输入区 ---------- */
  .composer {
    flex: 0 0 auto;
    background: var(--wx-input-bg);
    border-top: 1px solid var(--wx-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .composer-inner {
    width: 100%;
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    align-items: end;
  }
  .composer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .attach-btn {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: var(--wx-white);
    color: var(--wx-text-secondary);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
  }
  .attach-btn:hover { background: #f0f0f0; }

  .composer textarea {
    width: 100%;
    min-height: 40px;
    max-height: 120px;
    resize: none;
    padding: 9px 12px;
    border: none;
    border-radius: 6px;
    background: var(--wx-white);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.4;
    color: var(--wx-text);
    outline: none;
  }
  .composer textarea::placeholder { color: var(--wx-text-muted); }

  .send-btn {
    height: 34px;
    padding: 0 10px;
    border: none;
    border-radius: 6px;
    background: var(--wx-green);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, opacity .15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .send-btn:hover { background: var(--wx-green-dark); }
  .send-btn:active { transform: scale(.98); }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- 设置抽屉 ---------- */
  .settings-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 30;
  }
  .settings-mask.show { opacity: 1; pointer-events: auto; }

  .settings-panel {
    position: absolute;
    top: 48px; right: 0; bottom: 0;
    width: 300px; max-width: 86vw;
    background: var(--wx-white);
    border-left: 1px solid var(--wx-border);
    box-shadow: -4px 0 16px rgba(0,0,0,.08);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 40;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .settings-panel.show { transform: translateX(0); }

  .settings-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--wx-border);
    flex: 0 0 auto;
  }
  .settings-head h2 { font-size: 16px; font-weight: 600; }
  .settings-body { padding: 8px 0 16px; flex: 1 1 auto; }
  .settings-group { padding: 12px 16px; }
  .settings-group + .settings-group { border-top: 1px solid #f0f0f0; }
  .settings-label {
    display: block; font-size: 12px; color: var(--wx-text-muted); margin-bottom: 6px;
  }
  .settings-input {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--wx-border); border-radius: 8px;
    background: #fafafa; font-family: inherit; font-size: 15px; color: var(--wx-text);
    outline: none; transition: border-color .15s, background .15s;
  }
  .settings-input:focus { border-color: var(--wx-green); background: #fff; }
  .settings-hint { font-size: 11px; color: var(--wx-text-muted); margin-top: 6px; line-height: 1.5; }
  .uuid-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--wx-text-secondary);
    background: #f2f2f2; padding: 8px 10px; border-radius: 6px;
    word-break: break-all; user-select: all;
  }

  .qr-btn {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--wx-border);
    border-radius: 8px;
    background: #fafafa;
    font-family: inherit;
    font-size: 14px;
    color: var(--wx-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background .15s;
  }
  .qr-btn:hover { background: #f0f0f0; }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .switch-row > span:first-child { font-size: 14px; color: var(--wx-text); }
  .switch-input {
    width: 18px; height: 18px;
    accent-color: var(--wx-green);
    cursor: pointer;
    flex: 0 0 auto;
  }

  /* ---------- 预览遮罩 ---------- */
  .preview-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .preview-mask.show { display: flex; }
  .preview-mask img,
  .preview-mask video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    background: #000;
  }
  .preview-mask iframe {
    width: 90vw; height: 85vh;
    border: none; border-radius: 6px; background: #fff;
  }
  .preview-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,.15);
    color: #fff; font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 201;
  }
  .preview-close:hover { background: rgba(255,255,255,.3); }

  /* ---------- 二维码弹窗 ---------- */
  .qr-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 210;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .qr-mask.show { display: flex; }
  .qr-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    width: 320px;
    max-width: 90vw;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    text-align: center;
  }
  .qr-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .qr-card-head h3 { font-size: 16px; font-weight: 600; }
  .qr-canvas-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    margin-bottom: 12px;
  }
  .qr-canvas-wrap img {
    width: 220px;
    height: 220px;
    display: block;
    border-radius: 6px;
  }
  .qr-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--wx-text-secondary);
    background: #f2f2f2;
    padding: 8px 10px;
    border-radius: 6px;
    word-break: break-all;
    user-select: all;
    margin-bottom: 8px;
  }
  .qr-hint { font-size: 11px; color: var(--wx-text-muted); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 90px;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(0,0,0,.75); color: #fff;
    padding: 8px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 100; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .time-divider { text-align: center; margin: 8px 0 14px; font-size: 11px; color: var(--wx-text-muted); }
  .time-divider span { background: rgba(0,0,0,.04); padding: 2px 8px; border-radius: 3px; }

  @media (max-width: 560px) {
    .bubble-wrap { max-width: 78%; }
    .avatar { flex-basis: 32px; width: 32px; height: 32px; font-size: 13px; }
    .topbar { height: 44px; }
    .topbar-title { font-size: 16px; }
    .topbar-status { font-size: 11px; }
    .messages-inner { padding: 12px 8px 6px; }
    .composer-inner { padding: 6px 8px; }
    .send-btn { padding: 0 10px; font-size: 13px; height: 32px; }
    .attach-btn { width: 38px; height: 38px; font-size: 20px; }
    .settings-panel { top: 44px; width: 280px; }
    .file-name { max-width: 150px; }
    .file-check { margin-top: 7px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="topbar-title">知了涯-LocalShT传输助手</div>
    <div class="topbar-right">
      <div class="topbar-status">
        <span class="dot off" id="wsDot"></span>
        <span id="wsText">连接中</span>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" title="设置" aria-expanded="false">⚙ 设置</button>
    </div>
  </div>

  <!-- 消息区 -->
  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner">
      <div class="empty-tip" id="emptyTip">暂无消息，发送第一条吧</div>
    </div>
  </div>

  <!-- 多选下载工具栏 -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="toolbar-inner">
      <button type="button" id="dlSelectedBtn" class="primary">⬇ 下载选中</button>
      <button type="button" id="clearSelBtn">清除选择</button>
      <span class="sel-count" id="selCount">已选 0 个</span>
    </div>
  </div>

  <!-- 输入区 -->
  <form class="composer" id="form" autocomplete="off">
    <div class="composer-inner">
      <textarea id="content" placeholder="输入文本…" rows="1"></textarea>
      <div class="composer-actions">
        <button type="button" class="attach-btn" id="attachBtn" title="发送文件">＋</button>
        <button class="send-btn" type="submit" id="sendBtn" style="display:none">发送</button>
      </div>
    </div>
  </form>

  <!-- 隐藏的文件选择 -->
  <input type="file" id="fileInput" multiple style="display:none">

  <!-- 设置遮罩 + 抽屉 -->
  <div class="settings-mask" id="settingsMask"></div>
  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-head">
      <h2>设置</h2>
      <button class="icon-btn" id="settingsCloseBtn" type="button" title="关闭">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <label class="settings-label" for="username">昵称</label>
        <input type="text" class="settings-input" id="username" maxlength="24" placeholder="输入昵称">
        <div class="settings-hint">仅用于消息展示，修改不影响身份识别。</div>
      </div>
      <div class="settings-group">
        <span class="settings-label">移动端快捷访问</span>
        <button type="button" class="qr-btn" id="qrBtn">📱 显示访问二维码</button>
        <div class="settings-hint">用手机扫码即可打开本页面，无需手动输入 IP 和端口。</div>
      </div>
      <div class="settings-group">
        <label class="switch-row" for="checkToggle">
          <span>文件多选下载</span>
          <input type="checkbox" class="switch-input" id="checkToggle">
        </label>
        <div class="settings-hint">开启后消息中的文件旁会显示勾选框，可批量下载。默认关闭。</div>
      </div>
      <div class="settings-group">
        <span class="settings-label">本机身份标识（UUID）</span>
        <div class="uuid-text" id="uuidText">-</div>
        <div class="settings-hint">首次访问自动生成并保存在浏览器本地，用于区分「我」和他人。</div>
      </div>
    </div>
  </aside>
</div>

<!-- 预览遮罩 -->
<div class="preview-mask" id="previewMask">
  <button class="preview-close" id="previewCloseBtn" type="button" title="关闭">✕</button>
  <div id="previewBody"></div>
</div>

<!-- 二维码遮罩 -->
<div class="qr-mask" id="qrMask">
  <div class="qr-card">
    <div class="qr-card-head">
      <h3>扫码访问</h3>
      <button class="icon-btn" id="qrCloseBtn" type="button" title="关闭">✕</button>
    </div>
    <div class="qr-canvas-wrap" id="qrCanvasWrap"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="qr-hint">手机与电脑需在同一局域网（Wi-Fi）下</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  // 存储 / 身份
  // ============================================================
  var CID_KEY = 'textshare_cid';
  var USERNAME_KEY = 'textshare_username';
  var CHECK_KEY = 'textshare_show_check';

  function uuid() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    var b = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b);
    else for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256);
    b[6] = (b[6] & 0x0f) | 0x40;
    b[8] = (b[8] & 0x3f) | 0x80;
    var hex = [];
    for (var j = 0; j < 16; j++) hex.push((b[j] + 0x100).toString(16).slice(1));
    return hex.slice(0,4).join('') + '-' + hex.slice(4,6).join('') + '-' +
           hex.slice(6,8).join('') + '-' + hex.slice(8,10).join('') + '-' +
           hex.slice(10,16).join('');
  }
  var clientID = localStorage.getItem(CID_KEY);
  if (!clientID) { clientID = uuid(); localStorage.setItem(CID_KEY, clientID); }

  function guessDeviceName() {
    var ua = navigator.userAgent || '', platform = navigator.platform || '', name = '';
    if (/iPhone/i.test(ua)) name = 'iPhone';
    else if (/iPad/i.test(ua)) name = 'iPad';
    else if (/Android/i.test(ua)) {
      var m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build|\))/);
      name = m ? m[1].trim() : 'Android';
    } else if (/Windows/i.test(platform) || /Windows/i.test(ua)) name = 'Windows';
    else if (/Mac/i.test(platform) || /Mac OS X/i.test(ua)) name = 'Mac';
    else if (/Linux/i.test(platform)) name = 'Linux';
    else name = '设备';
    return name + '-' + Math.random().toString(36).slice(2, 6);
  }
  function resolveUsername() {
    var s = localStorage.getItem(USERNAME_KEY);
    if (s) return s;
    var n = guessDeviceName();
    localStorage.setItem(USERNAME_KEY, n);
    return n;
  }

  // ============================================================
  // DOM
  // ============================================================
  var messagesEl = document.getElementById('messages');
  var messagesInner = document.getElementById('messagesInner');
  var emptyTip = document.getElementById('emptyTip');
  var wsDot = document.getElementById('wsDot');
  var wsText = document.getElementById('wsText');
  var toastEl = document.getElementById('toast');
  var usernameInput = document.getElementById('username');
  var uuidText = document.getElementById('uuidText');
  var contentEl = document.getElementById('content');
  var sendBtn = document.getElementById('sendBtn');
  var attachBtn = document.getElementById('attachBtn');
  var fileInput = document.getElementById('fileInput');

  var toolbar = document.getElementById('toolbar');
  var selCount = document.getElementById('selCount');
  var dlSelectedBtn = document.getElementById('dlSelectedBtn');
  var clearSelBtn = document.getElementById('clearSelBtn');

  var settingsBtn = document.getElementById('settingsBtn');
  var settingsPanel = document.getElementById('settingsPanel');
  var settingsMask = document.getElementById('settingsMask');
  var settingsCloseBtn = document.getElementById('settingsCloseBtn');
  var checkToggle = document.getElementById('checkToggle');

  var previewMask = document.getElementById('previewMask');
  var previewBody = document.getElementById('previewBody');
  var previewCloseBtn = document.getElementById('previewCloseBtn');

  var qrBtn = document.getElementById('qrBtn');
  var qrMask = document.getElementById('qrMask');
  var qrCloseBtn = document.getElementById('qrCloseBtn');
  var qrCanvasWrap = document.getElementById('qrCanvasWrap');
  var qrUrl = document.getElementById('qrUrl');

  usernameInput.value = resolveUsername();
  uuidText.textContent = clientID;

  // ============================================================
  // 设置抽屉
  // ============================================================
  var settingsOpen = false;
  function openSettings() {
    if (settingsOpen) return;
    settingsOpen = true;
    settingsPanel.classList.add('show');
    settingsMask.classList.add('show');
    settingsPanel.setAttribute('aria-hidden', 'false');
    settingsBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSettings() {
    if (!settingsOpen) return;
    settingsOpen = false;
    settingsPanel.classList.remove('show');
    settingsMask.classList.remove('show');
    settingsPanel.setAttribute('aria-hidden', 'true');
    settingsBtn.setAttribute('aria-expanded', 'false');
  }
  settingsBtn.addEventListener('click', function () { settingsOpen ? closeSettings() : openSettings(); });
  settingsCloseBtn.addEventListener('click', closeSettings);
  settingsMask.addEventListener('click', closeSettings);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && settingsOpen) closeSettings(); });

  usernameInput.addEventListener('change', function () {
    var v = usernameInput.value.trim();
    if (v) localStorage.setItem(USERNAME_KEY, v);
    else { var d = guessDeviceName(); usernameInput.value = d; localStorage.setItem(USERNAME_KEY, d); }
  });

  // ============================================================
  // 展示辅助
  // ============================================================
  function fileIcon(kind) {
    if (kind === 'image') return '🖼️';
    if (kind === 'video') return '🎬';
    if (kind === 'pdf')   return '📕';
    return '📄';
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // ============================================================
  // 条目 Map + 有序数组
  // ============================================================
  var rowMap = new Map();
  var order = [];
  var selected = new Set();

  function getRows() {
    var out = [];
    for (var i = 0; i < order.length; i++) {
      var r = rowMap.get(order[i]);
      if (r) out.push(r);
    }
    return out;
  }

  var FIVE_MIN = 5 * 60 * 1000;

  function upsertRows(list) {
    var changed = false;
    list.forEach(function (r) {
      if (!r || typeof r.id === 'undefined') return;
      if (!rowMap.has(r.id)) order.push(r.id);
      rowMap.set(r.id, r);
      changed = true;
    });
    if (!changed) return;

    var prev = null;
    order.forEach(function (id) {
      var r = rowMap.get(id);
      if (!r) return;
      if (!prev) { r.show_divider = true; }
      else if (r.show_divider && r.ts - prev.ts <= FIVE_MIN) { r.show_divider = false; }
      prev = r;
    });

    renderAll();
  }

  // ============================================================
  // 渲染 —— 显式 DOM 顺序控制头像左右
  //
  // 统一目标（文本 / 文件 / 文件集合 一致）：
  //   其他人(other)：从左往右  [头像] → [名称(气泡上方靠左) + 气泡]
  //   我    (self) ：从右往左  [头像] ← [名称(气泡上方靠右) + 气泡]
  //
  // DOM 顺序：
  //   other：rowEl = [勾选框?, 头像, wrap(名称+气泡)]
  //   self ：rowEl = [勾选框?, wrap(名称+气泡), 头像]
  //   整行用 justify-content 贴左 / 贴右。
  // ============================================================
  function buildMetaEl(row) {
    var meta = document.createElement('div');
    meta.className = 'meta';
    var nameEl = document.createElement('span');
    nameEl.className = 'name';
    nameEl.textContent = row.display_name || '匿名';
    meta.appendChild(nameEl);
    return meta;
  }

  function buildTextNode(row) {
    var self = !!row.is_self;
    var rowEl = document.createElement('div');
    rowEl.className = 'msg-row ' + (self ? 'self' : 'other');
    rowEl.dataset.id = row.id;

    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = row.avatar_text || '?';

    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    wrap.appendChild(buildMetaEl(row));

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = row.content;
    wrap.appendChild(bubble);

    // other：头像在左；self：头像在右。名称始终在气泡上方。
    if (self) {
      rowEl.appendChild(wrap);
      rowEl.appendChild(av);
    } else {
      rowEl.appendChild(av);
      rowEl.appendChild(wrap);
    }
    return rowEl;
  }

  function buildFileItemEl(item) {
    var el = document.createElement('div');
    el.className = 'file-item';

    var pk = item.preview_kind || '';
    if (pk) el.classList.add('previewable');

    var icon = document.createElement('div');
    icon.className = 'file-icon-sm';
    if (pk === 'image' && item.preview_url) {
      var img = document.createElement('img');
      img.src = item.preview_url;
      img.alt = item.filename || '';
      img.loading = 'lazy';
      img.addEventListener('error', function () {
        icon.textContent = fileIcon(pk);
        icon.classList.remove('has-thumb');
      });
      icon.appendChild(img);
      icon.classList.add('has-thumb');
    } else {
      icon.textContent = fileIcon(pk);
    }

    var info = document.createElement('div');
    info.className = 'file-info';
    var fn = document.createElement('div');
    fn.className = 'file-name';
    fn.title = item.filename;
    fn.textContent = item.filename;
    var fs = document.createElement('div');
    fs.className = 'file-size';
    fs.textContent = item.size_text || '';
    info.appendChild(fn);
    info.appendChild(fs);

    var dl = document.createElement('a');
    dl.className = 'file-dl';
    dl.href = item.download_url || '#';
    dl.title = '下载文件';
    dl.textContent = '⬇';
    dl.addEventListener('click', function (e) { e.stopPropagation(); });

    el.appendChild(icon);
    el.appendChild(info);
    el.appendChild(dl);

    if (pk) {
      el.addEventListener('click', function (e) {
        if (e.target === dl) return;
        openPreview(item);
      });
    }
    return el;
  }

  function buildFileNode(row) {
    var self = !!row.is_self;
    var rowEl = document.createElement('div');
    rowEl.className = 'msg-row ' + (self ? 'self' : 'other');
    rowEl.dataset.id = row.id;

    var av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = row.avatar_text || '?';

    var wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    wrap.appendChild(buildMetaEl(row));   // 名称在气泡上方

    var files = (row.files && row.files.length) ? row.files : [{
      id: row.id, filename: row.filename, filesize: row.filesize,
      size_text: row.size_text, preview_kind: row.preview_kind,
      preview_url: row.preview_url, download_url: row.download_url
    }];
    var isGroup = files.length > 1;

    var fileRow = document.createElement('div');
    fileRow.className = 'file-row';

    var chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.className = 'file-check';
    chk.value = String(row.id);
    chk.checked = selected.has(String(row.id));
    chk.addEventListener('change', onFileCheck);

    var card = document.createElement('div');
    card.className = 'file-card'
      + (isGroup ? ' grouped' : '')
      + (!isGroup && files[0].preview_kind ? ' previewable' : '');
    if (isGroup) card.title = '点击展开/收起';
    else if (files[0].preview_kind) card.title = '点击预览';

    var icon = document.createElement('div');
    icon.className = 'file-icon';
    if (isGroup) {
      icon.textContent = '📁';
    } else if (files[0].preview_kind === 'image' && files[0].preview_url) {
      var thumb = document.createElement('img');
      thumb.className = 'file-thumb';
      thumb.src = files[0].preview_url;
      thumb.alt = files[0].filename || '';
      thumb.loading = 'lazy';
      thumb.addEventListener('error', function () {
        icon.textContent = fileIcon(files[0].preview_kind);
        icon.classList.remove('has-thumb');
      });
      icon.appendChild(thumb);
      icon.classList.add('has-thumb');
    } else {
      icon.textContent = fileIcon(files[0].preview_kind);
    }

    var info = document.createElement('div');
    info.className = 'file-info';
    var fn = document.createElement('div');
    fn.className = 'file-name';
    fn.title = isGroup ? (files.length + ' 个文件') : files[0].filename;
    fn.textContent = isGroup ? (files.length + ' 个文件') : files[0].filename;
    var fs = document.createElement('div');
    fs.className = 'file-size';
    fs.textContent = isGroup ? '点击展开查看' : (files[0].size_text || '');
    info.appendChild(fn);
    info.appendChild(fs);

    var dl = document.createElement('a');
    dl.className = 'file-dl';
    dl.href = isGroup ? 'javascript:void(0)' : (files[0].download_url || '#');
    dl.title = isGroup ? '下载全部' : '下载文件';
    dl.textContent = '⬇';
    dl.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isGroup) {
        files.forEach(function (it, i) {
          setTimeout(function () {
            var a = document.createElement('a');
            a.href = it.download_url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, i * 300);
        });
      }
    });

    card.appendChild(icon);
    card.appendChild(info);
    card.appendChild(dl);

    var expandWrap = null;
    if (isGroup) {
      expandWrap = document.createElement('div');
      expandWrap.className = 'file-expand';
      files.forEach(function (it) {
        expandWrap.appendChild(buildFileItemEl(it));
      });
      var collapseBtn = document.createElement('button');
      collapseBtn.type = 'button';
      collapseBtn.className = 'file-collapse-btn';
      collapseBtn.textContent = '收起 ▲';
      collapseBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        collapseGroup();
      });
      expandWrap.appendChild(collapseBtn);
    }

    function expandGroup() {
      if (!isGroup || !expandWrap) return;
      card.classList.add('expanded');
      if (!expandWrap.parentNode) fileRow.appendChild(expandWrap);
    }
    function collapseGroup() {
      if (!isGroup) return;
      card.classList.remove('expanded');
      if (expandWrap && expandWrap.parentNode) {
        expandWrap.parentNode.removeChild(expandWrap);
      }
    }

    card.addEventListener('click', function () {
      if (isGroup) {
        if (card.classList.contains('expanded')) collapseGroup();
        else expandGroup();
      } else if (files[0].preview_kind) {
        openPreview(files[0]);
      }
    });

    fileRow.appendChild(card);
    wrap.appendChild(fileRow);   // 气泡（文件卡片/文件集合）在名称下方

    // 勾选框独立于气泡-头像顺序，始终放在气泡外侧：
    //   other： [勾, 头像, wrap]
    //   self ： [勾, wrap, 头像]（整行贴右，勾选框在气泡左侧外侧）
    if (self) {
      rowEl.appendChild(chk);
      rowEl.appendChild(wrap);
      rowEl.appendChild(av);
    } else {
      rowEl.appendChild(chk);
      rowEl.appendChild(av);
      rowEl.appendChild(wrap);
    }

    return rowEl;
  }

  function buildMsgNode(row) {
    return row.kind === 'file' ? buildFileNode(row) : buildTextNode(row);
  }

  function renderAll() {
    var rows = getRows();
    if (!rows.length) {
      messagesInner.innerHTML = '';
      messagesInner.appendChild(emptyTip);
      emptyTip.style.display = 'block';
      updateSelectionUI();
      return;
    }
    emptyTip.style.display = 'none';

    var frag = document.createDocumentFragment();
    rows.forEach(function (r) {
      if (r.show_divider) {
        var div = document.createElement('div');
        div.className = 'time-divider';
        var span = document.createElement('span');
        span.textContent = r.time_label || '';
        div.appendChild(span);
        frag.appendChild(div);
      }
      frag.appendChild(buildMsgNode(r));
    });

    messagesInner.innerHTML = '';
    messagesInner.appendChild(frag);
    updateSelectionUI();
  }

  function scrollToBottom() {
    requestAnimationFrame(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }
  function isNearBottom() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  }

  // ============================================================
  // 勾选 / 多选下载
  // ============================================================
  function onFileCheck(e) {
    var id = e.target.value;
    if (e.target.checked) selected.add(id); else selected.delete(id);
    updateSelectionUI();
  }

  function updateSelectionUI() {
    var n = selected.size;
    selCount.textContent = '已选 ' + n + ' 个';
    if (n > 0) toolbar.style.display = 'flex';
    else toolbar.style.display = 'none';
  }

  clearSelBtn.addEventListener('click', function () {
    selected.clear();
    messagesInner.querySelectorAll('.file-check').forEach(function (c) { c.checked = false; });
    updateSelectionUI();
  });

  dlSelectedBtn.addEventListener('click', function () {
    var ids = Array.from(selected);
    if (!ids.length) { toast('请先勾选文件'); return; }

    var fileIds = [];
    ids.forEach(function (id) {
      var row = rowMap.get(Number(id)) || rowMap.get(id);
      if (!row) return;
      if (row.files && row.files.length) {
        row.files.forEach(function (f) { fileIds.push(f.id); });
      } else {
        fileIds.push(row.id);
      }
    });

    fileIds.forEach(function (fid, i) {
      setTimeout(function () {
        var a = document.createElement('a');
        a.href = '/download?msg=' + encodeURIComponent(fid);
        a.download = '';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, i * 300);
    });
    setTimeout(function () {
      selected.clear();
      messagesInner.querySelectorAll('.file-check').forEach(function (c) { c.checked = false; });
      updateSelectionUI();
    }, fileIds.length * 300 + 200);
  });

  // ============================================================
  // 勾选显示开关
  // ============================================================
  function applyCheckVisibility(on) {
    document.body.classList.toggle('show-file-check', !!on);
    checkToggle.checked = !!on;
    if (!on) {
      selected.clear();
      messagesInner.querySelectorAll('.file-check').forEach(function (c) { c.checked = false; });
      updateSelectionUI();
    }
  }
  function initCheckToggle() {
    var on = localStorage.getItem(CHECK_KEY) === '1';
    applyCheckVisibility(on);
    checkToggle.addEventListener('change', function () {
      var v = checkToggle.checked;
      localStorage.setItem(CHECK_KEY, v ? '1' : '0');
      applyCheckVisibility(v);
    });
  }

  // ============================================================
  // 预览
  // ============================================================
  function openPreview(item) {
    previewBody.innerHTML = '';
    var pk = item.preview_kind;
    var url = item.preview_url;
    if (!pk || !url) return;

    if (pk === 'image') {
      var img = document.createElement('img');
      img.src = url;
      img.alt = item.filename || '';
      previewBody.appendChild(img);
    } else if (pk === 'video') {
      var v = document.createElement('video');
      v.src = url;
      v.controls = true;
      v.autoplay = true;
      v.playsInline = true;
      previewBody.appendChild(v);
    } else if (pk === 'pdf') {
      var ifr = document.createElement('iframe');
      ifr.src = url;
      ifr.title = item.filename || 'PDF';
      previewBody.appendChild(ifr);
    }
    previewMask.classList.add('show');
  }
  function closePreview() {
    previewMask.classList.remove('show');
    previewBody.innerHTML = '';
  }
  previewCloseBtn.addEventListener('click', closePreview);
  previewMask.addEventListener('click', function (e) {
    if (e.target === previewMask) closePreview();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePreview();
  });

  // ============================================================
  // 二维码弹窗
  // ============================================================
  function openQR() {
    closeSettings();
    qrCanvasWrap.innerHTML = '<div style="color:#888;font-size:13px;">加载中…</div>';
    qrUrl.textContent = '';
    qrMask.classList.add('show');

    fetch('/share/info')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.url) {
          qrCanvasWrap.innerHTML = '<div style="color:#fa5151;font-size:13px;">无法获取访问地址</div>';
          return;
        }
        qrUrl.textContent = data.url;
        var img = document.createElement('img');
        img.src = '/share/qr?url=' + encodeURIComponent(data.url);
        img.alt = '访问二维码';
        img.onerror = function () {
          qrCanvasWrap.innerHTML = '<div style="color:#fa5151;font-size:13px;">二维码生成失败</div>';
        };
        qrCanvasWrap.innerHTML = '';
        qrCanvasWrap.appendChild(img);
      })
      .catch(function () {
        qrCanvasWrap.innerHTML = '<div style="color:#fa5151;font-size:13px;">网络错误</div>';
      });
  }
  function closeQR() {
    qrMask.classList.remove('show');
    qrCanvasWrap.innerHTML = '';
  }
  qrBtn.addEventListener('click', openQR);
  qrCloseBtn.addEventListener('click', closeQR);
  qrMask.addEventListener('click', function (e) { if (e.target === qrMask) closeQR(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeQR(); });

  // ============================================================
  // 历史加载 + WebSocket
  // ============================================================
  function loadHistory() {
    return fetch('/history?cid=' + encodeURIComponent(clientID) + '&limit=200', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        rowMap.clear(); order.length = 0; selected.clear();
        upsertRows(data.rows || []);
        scrollToBottom();
      })
      .catch(function () { /* 忽略 */ });
  }

  var ws = null, retry = 0;
  function setStatus(on, text) {
    wsDot.className = 'dot ' + (on ? 'on' : 'off');
    wsText.textContent = text;
  }
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    try { ws = new WebSocket(proto + location.host + '/ws?cid=' + encodeURIComponent(clientID)); }
    catch (e) { schedule(); return; }
    setStatus(false, '连接中');
    ws.onopen = function () { retry = 0; setStatus(true, '已连接'); };
    ws.onmessage = function (e) {
      var ev; try { ev = JSON.parse(e.data); } catch (_) { return; }
      if (!ev || !ev.type) return;
      if (ev.type === 'history') {
        rowMap.clear(); order.length = 0; selected.clear();
        upsertRows(ev.rows || []);
        scrollToBottom();
      } else if (ev.type === 'message_upsert' && ev.row) {
        var atBottom = isNearBottom();
        upsertRows([ev.row]);
        if (atBottom) scrollToBottom();
      }
    };
    ws.onclose = function () { setStatus(false, '已断开'); schedule(); };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
  }
  function schedule() {
    var d = Math.min(30000, 1000 * Math.pow(2, retry++));
    setTimeout(connect, d);
  }

  // ============================================================
  // 输入区
  // ============================================================
  function updateComposerState() {
    var hasText = contentEl.value.trim().length > 0;
    attachBtn.style.visibility = hasText ? 'hidden' : 'visible';
    sendBtn.style.display = hasText ? 'inline-flex' : 'none';
  }

  contentEl.addEventListener('input', function () {
    contentEl.style.height = 'auto';
    contentEl.style.height = Math.min(contentEl.scrollHeight, 120) + 'px';
    updateComposerState();
  });
  contentEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submitText();
    }
  });
  updateComposerState();

  attachBtn.addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', function () {
    if (!fileInput.files || !fileInput.files.length) return;
    uploadFiles(Array.prototype.slice.call(fileInput.files));
    fileInput.value = '';
  });

  // ============================================================
  // 发送文本
  // ============================================================
  function submitText() {
    var content = contentEl.value.trim();
    if (!content) return;

    var username = usernameInput.value.trim() || resolveUsername();
    localStorage.setItem(USERNAME_KEY, username);

    var body = new URLSearchParams();
    body.append('cid', clientID);
    body.append('username', username);
    body.append('content', content);

    sendBtn.disabled = true;
    fetch('/texts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (row) {
      upsertRows([row]);
      scrollToBottom();
      contentEl.value = '';
      contentEl.style.height = 'auto';
      updateComposerState();
      contentEl.focus();
    }).catch(function (err) {
      toast('发送失败：' + err.message);
    }).finally(function () { sendBtn.disabled = false; });
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    submitText();
  });

  // ============================================================
  // 上传文件
  // ============================================================
  function uploadFiles(files) {
    var username = usernameInput.value.trim() || resolveUsername();
    localStorage.setItem(USERNAME_KEY, username);

    var pending = files.slice();
    var total = pending.length;
    var done = 0;
    toast('正在上传 ' + total + ' 个文件…');

    function next() {
      if (!pending.length) {
        if (done > 0) toast('已上传 ' + done + ' 个文件');
        return;
      }
      var f = pending.shift();
      var fd = new FormData();
      fd.append('file', f);
      fd.append('cid', clientID);
      fd.append('username', username);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          done++;
        } else {
          toast('上传失败：' + f.name);
        }
        next();
      };
      xhr.onerror = function () { toast('上传失败：' + f.name); next(); };
      xhr.send(fd);
    }
    next();
  }

  // ============================================================
  // 其它
  // ============================================================
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      if (ws && ws.readyState === WebSocket.CLOSED) { retry = 0; connect(); }
      if (isNearBottom()) scrollToBottom();
    }
  });

  // 启动
  initCheckToggle();
  loadHistory().then(connect);
})();
</script>
</body>
</html>
